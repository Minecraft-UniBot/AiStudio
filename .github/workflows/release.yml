# UniBot Extension Studio 单文件可执行版发布工作流
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）—— 只构建并上传 artifacts
#   2. 推送 tag v*（如 v0.2.0）—— 构建并创建 GitHub Release 草稿
#
# 产物（每平台一个自包含可执行文件，双击即运行，无需安装 bun / opencode）：
#   macOS ARM64 : unibot-studio-macos-arm64
#   macOS x64   : unibot-studio-macos-x64（由 macos ARM64 runner 交叉编译，best-effort）
#   Windows x64 : unibot-studio-windows-x64.exe
#   Linux x64   : unibot-studio-linux-x64
#
# 说明：
#   - 单文件 = 后端 bundle + 前端构建产物 + prompts/skills/validation/plugins
#     （opencode 不内置以减小体积：首次启动时由后端自动下载到数据目录，
#      见 server/src/opencode_download.ts，用户无需另行安装）
#   - 版本号取 tag 中 v 前缀之后的部分（v0.2.0 -> 0.2.0），手动触发用 git tag / 默认 0.1.0
#   - 构建在原生 runner 上进行：macos-14(arm64) / windows-latest / ubuntu-24.04；
#     macOS x64 变体由 macos-14 交叉编译（--target=bun-darwin-x64）生成，
#     交叉编译失败不影响发布（continue-on-error + 空产物跳过上传）
#   - 本仓库为独立仓库（不含 Market/），server 测试依赖市场注册表
#     Market/extensions.json，故额外拉取 MineJPGcraft/UniBot.Market 到 Market/

name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-24.04
          # ARM64 Linux 构建（GitHub 公开预览 runner）：
          # - name: linux-arm64
          #   runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Studio 是独立仓库，不含 Market/；server 测试与提示词依赖市场注册表，
      # 拉取到工作区根 Market/ 以匹配 config.ts 的路径解析（Studio/../Market）。
      - name: Checkout Market registry
        uses: actions/checkout@v4
        with:
          repository: MineJPGcraft/UniBot.Market
          path: Market

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: |
          cd server && bun install --frozen-lockfile
          cd ../web && bun install --frozen-lockfile

      - name: Run server tests
        shell: bash
        run: cd server && bun test

      - name: Resolve app version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION=""; fi
          echo "STUDIO_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建版本：${VERSION:-git tag / 默认 0.1.0}"

      # 一键打包：安装依赖（幂等）→ 构建前端（vite）→ 预打包插件 → 编译单文件可执行版
      # （server bundle + web/dist + prompts/skills/validation/plugins 全部嵌入；
      #  opencode 不内置，首次启动时由后端自动下载，见 server/src/opencode_download.ts）
      - name: Build single-file executable
        shell: bash
        run: bun release/build.ts --name unibot-studio-${{ matrix.name }} --frozen

      # macOS x64 变体：由 macos-14（ARM64）runner 交叉编译（bun build --compile --target）。
      # 交叉编译失败不阻塞发布：continue-on-error，下方 x64 上传步骤按文件是否存在兜底。
      - name: Cross-compile macOS x64 variant
        if: matrix.name == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: bun release/build.ts --name unibot-studio-macos-x64 --target bun-darwin-x64 --frozen

      - name: Verify artifact
        shell: bash
        run: |
          ls -la release/artifacts/
          test -n "$(ls release/artifacts/ | grep -E '^unibot-studio-')"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: unibot-studio-${{ matrix.name }}
          path: release/artifacts/unibot-studio-${{ matrix.name }}*
          if-no-files-found: error

      # x64 交叉编译产物：文件存在才上传（交叉编译失败时静默跳过）
      - name: Upload macOS x64 cross-compiled artifact
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: unibot-studio-macos-x64
          path: release/artifacts/unibot-studio-macos-x64
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          name: "UniBot Extension Studio ${{ github.ref_name }}"
          draft: true
          files: release-artifacts/**
          generate_release_notes: true

# UniBot Extension Studio 桌面客户端打包工作流
#
# 产物（Electrobun 生产构建，原生窗口应用 —— 各平台自包含运行包，非安装包）：
#   macOS ARM64 : production-macos-arm64-UniBotExtensionStudio.app.tar.zst （内含 .app）
#   Windows x64 : production-win-x64-UniBotExtensionStudio.tar.zst（含主程序 exe）
#   Linux x64   : production-linux-x64-UniBotExtensionStudio.tar.zst（含可执行文件）
# 上传 / Release 只保留这三个 production 渠道的 app 归档（原样 `.tar.zst`，不打包成 zip，
# 也不发布 `stable-` 别名归档——它是 Electrobun 1.x 兼容用的，每平台保留一套即可）。
# 不发布安装包（.dmg / *-Setup.zip / *-Setup.tar.gz）。
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）—— 只构建并上传 artifacts
#   2. 推送 tag desktop-v*（如 desktop-v0.2.0）—— 构建并创建 GitHub Release 草稿
#
# 说明：
#   - opencode 从 npm registry 获取平台二进制（opencode-<os>-<arch> 包，
#     desktop/scripts/fetch-opencode.ts），随应用内置，用户无需另行安装
#   - 版本号取 tag 中的 v 前缀之后的部分（desktop-v0.2.0 -> 0.2.0），
#     手动触发默认 0.1.0，可用仓库变量覆盖
#   - 构建在原生 runner 上进行（hutch 只构建当前宿主平台）：macos-14(arm64) /
#     windows-latest / ubuntu-24.04；Electrobun 无 macOS x64 核心，Intel Mac 用 Web 版
#   - 本仓库为独立仓库（不含 Market/），server 测试依赖市场注册表
#     Market/extensions.json，故额外拉取 MineJPGcraft/UniBot.Market 到 Market/

name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-24.04
          # ARM64 Linux 构建（GitHub 公开预览 runner）：
          # - name: linux-arm64
          #   runner: ubuntu-24.04-arm
    env:
      # 与 server/src/config.ts 的 opencode.version 保持一致
      OPENCODE_VERSION: "1.18.18"
    steps:
      - uses: actions/checkout@v4

      # Studio 是独立仓库，不含 Market/；server 测试与提示词依赖市场注册表，
      # 拉取到工作区根 Market/ 以匹配 config.ts 的路径解析（Studio/../Market）。
      - name: Checkout Market registry
        uses: actions/checkout@v4
        with:
          repository: MineJPGcraft/UniBot.Market
          path: Market

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 缓存整个 ~/.hutch（含 state/store.json 所有权标记），而不是仅缓存子目录：
      # hutch 0.11.0 起，installer 的 bootstrap-install 会校验「未标记」的 home——
      # 若恢复出的 ~/.hutch 缺 state/store.json 且带 toolchains/ 等额外目录，
      # 会拒绝认领并报 "refusing to claim an unmarked Hutch home"。
      # 整目录缓存 + 更换 key 让首次运行干净认领并写入标记，之后每次恢复完整已标记 home。
      - name: Cache Hutch store
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-store-${{ matrix.name }}-2.0.1-beta.14

      # 固定 hutch 版本（0.11.0 起 installer 校验未标记 home；浮动 latest 会再次意外变更行为）
      - name: Install Hutch (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version 0.11.0
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
          "$HOME/.hutch/bin/hutch" --version

      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -Append $env:GITHUB_PATH
          & "$env:USERPROFILE\.hutch\bin\hutch.exe" --version

      - name: Install dependencies
        shell: bash
        run: |
          cd server && bun install --frozen-lockfile
          cd ../web && bun install --frozen-lockfile
          cd ../desktop && bun install --frozen-lockfile

      - name: Run server tests
        shell: bash
        run: cd server && bun test

      - name: Build web
        shell: bash
        run: cd web && bun run build

      - name: Fetch bundled opencode
        shell: bash
        run: cd desktop && bun scripts/fetch-opencode.ts

      - name: Stage app inputs (server bundle / web / opencode)
        shell: bash
        run: cd desktop && bun scripts/stage.ts

      - name: Resolve app version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.1.0"; fi
          echo "STUDIO_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建版本：$VERSION"

      # 注意：不要在 Windows 上把 Git for Windows 的 usr/bin 提前到 PATH！
      # hutch 打包内部以绝对路径调用 tar（tar -cf D:\...\bundle.tar ...），而 Git 自带的
      # GNU tar 会把 "D:\..." 中的盘符冒号误判为远程主机（RSH），报
      # "tar: Cannot connect to D: resolve failed"（见 blackboardsh/electrobun#149）。
      # Windows 自带的 System32 tar（bsdtar）没有远程归档功能，能正确处理 D:\ 绝对路径，
      # 官方 CI（windows-2025 + hutch 0.11.0）即依赖它直接构建成功。
      - name: Verify tar resolves to System32 bsdtar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "tar => $((Get-Command tar).Source)"
          tar --version

      # Windows 分支用 pwsh（与官方 CI 一致），避免 Git Bash 会话把 Git usr/bin 提到
      # PATH 最前导致 hutch 解析到有远程主机 bug 的 GNU tar。
      # （注：shell 字段不支持 ${{ runner.os }} 表达式，故按平台拆两个步骤）
      - name: Build production bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd desktop
          hutch electrobun build --env=production

      - name: Build production bundle (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd desktop
          hutch electrobun build --env=production

      - name: Verify artifacts
        shell: bash
        run: |
          ls -la desktop/artifacts/
          # 只校验 production 渠道的自包含 app 归档（macOS .app.tar.zst / Windows / Linux .tar.zst）
          test -n "$(ls desktop/artifacts/ | grep -E '^production-.*\.tar\.zst$')"

      # 只上传 production 渠道的自包含 app 归档（*.tar.zst，原样直传、不打包成 zip）。
      # production 构建同时会产出 stable-<os>-<arch>- 别名归档（Electrobun 1.x 兼容），
      # 这里用 ^production- 排除，只保留一套；也排除安装包（.dmg / *-Setup.zip / *-Setup.tar.gz）。
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: desktop/artifacts/production-*.tar.zst
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          name: "UniBot Extension Studio ${{ github.ref_name }}"
          draft: true
          files: release-artifacts/**
          generate_release_notes: true
